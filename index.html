<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Credit Manager</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f0f2f5; }
    .header { background: #1a73e8; color: white; padding: 16px 24px; font-size: 22px; font-weight: bold; }
    .container { max-width: 700px; margin: 30px auto; background: white; border-radius: 10px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h2 { color: #1a73e8; }
    input, select { width: 100%; padding: 10px; margin: 8px 0 16px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; box-sizing: border-box; }
    button { background: #1a73e8; color: white; border: none; padding: 10px 24px; border-radius: 6px; cursor: pointer; font-size: 15px; }
    button:hover { background: #1558b0; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th { background: #1a73e8; color: white; padding: 10px; text-align: left; }
    td { padding: 10px; border-bottom: 1px solid #eee; }
    tr:hover { background: #f5f9ff; }
    .badge-credit { background: #e6f4ea; color: #2e7d32; padding: 3px 10px; border-radius: 12px; }
    .badge-debit { background: #fce8e6; color: #c62828; padding: 3px 10px; border-radius: 12px; }
    .msg { color: green; margin: 8px 0; }
    .err { color: red; margin: 8px 0; }
  </style>
</head>
<body>

<div class="header">💳 Credit Manager - RAJ BROS</div>

<div class="container">
  <h2>Add Transaction</h2>
  <input type="text" id="name" placeholder="Customer Name" />
  <input type="number" id="amount" placeholder="Amount (Rs.)" />
  <select id="type">
    <option value="credit">Credit (கொடுத்தது)</option>
    <option value="debit">Debit (வாங்கியது)</option>
  </select>
  <input type="text" id="note" placeholder="Note (optional)" />
  <button onclick="addTransaction()">Add ➕</button>
  <p id="msg" class="msg"></p>
  <p id="err" class="err"></p>
</div>

<div class="container">
  <h2>Transactions</h2>
  <input type="text" id="search" placeholder="Search by name..." oninput="renderTable()" />
  <table>
    <thead>
      <tr><th>Name</th><th>Amount</th><th>Type</th><th>Note</th><th>Date</th></tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyClSrOKD2xjE_hQoidGRE4GLrX-VDViB1c",
    authDomain: "credit-system-3ccbc.firebaseapp.com",
    projectId: "credit-system-3ccbc",
    storageBucket: "credit-system-3ccbc.firebasestorage.app",
    messagingSenderId: "483627612591",
    appId: "1:483627612591:web:475c2e83f2768ba2dd175a",
    measurementId: "G-JE3PO4672H"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let allData = [];

  window.addTransaction = async function() {
    const name = document.getElementById('name').value.trim();
    const amount = document.getElementById('amount').value.trim();
    const type = document.getElementById('type').value;
    const note = document.getElementById('note').value.trim();

    if (!name || !amount) {
      document.getElementById('err').textContent = "Name and Amount required!";
      return;
    }
    document.getElementById('err').textContent = "";
    try {
      await addDoc(collection(db, "transactions"), {
        name, amount: parseFloat(amount), type, note,
        date: new Date().toLocaleString('en-IN')
      });
      document.getElementById('msg').textContent = "✅ Added successfully!";
      document.getElementById('name').value = '';
      document.getElementById('amount').value = '';
      document.getElementById('note').value = '';
      setTimeout(() => document.getElementById('msg').textContent = '', 2000);
    } catch(e) {
      document.getElementById('err').textContent = "Error: " + e.message;
    }
  }

  window.renderTable = function() {
    const q = document.getElementById('search').value.toLowerCase();
    const filtered = allData.filter(d => d.name.toLowerCase().includes(q));
    const body = document.getElementById('tableBody');
    body.innerHTML = filtered.map(d => `
      <tr>
        <td>${d.name}</td>
        <td>Rs. ${d.amount}</td>
        <td><span class="badge-${d.type}">${d.type}</span></td>
        <td>${d.note || '-'}</td>
        <td>${d.date}</td>
      </tr>
    `).join('');
  }

  const q = query(collection(db, "transactions"), orderBy("date", "desc"));
  onSnapshot(q, (snap) => {
    allData = snap.docs.map(d => d.data());
    renderTable();
  });
</script>
</body>
</html>
