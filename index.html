<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Credit Manager</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mu:#667085;--bd:#e2e5ea;--ac:#1d6fd8;--rd:#c62828;--gn:#1b8a3f;--am:#b26a00;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#14171b;--card:#1e2329;--tx:#eceff3;--mu:#98a2b3;--bd:#2f363e;--ac:#5aa2ff;--rd:#ff6b6b;--gn:#4cc274;--am:#f0a640;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.w{max-width:880px;margin:0 auto;padding:12px}
h1{font-size:19px;margin:0}h2{font-size:16px;margin:18px 0 8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat b{display:block;font-size:20px}.mu{color:var(--mu);font-size:13px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);margin:3px 0 8px}
button{padding:9px 14px;border:1px solid var(--bd);border-radius:8px;background:var(--card);cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.d{color:var(--rd)}button.s{padding:4px 9px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.row.n>*{flex:none}
.li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd);cursor:pointer}.li:last-child{border:0}
.red{color:var(--rd)}.grn{color:var(--gn)}.amb{color:var(--am)}
.al{border-left:4px solid var(--rd);padding:6px 10px;margin:6px 0;background:var(--bg);border-radius:6px;cursor:pointer}.al.w2{border-color:var(--am)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}
td,th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top;font-size:14px}th{color:var(--mu);font-weight:600}
td.n,th.n{text-align:right;white-space:nowrap}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);width:min(520px,94vw);max-height:90vh;padding:16px}
dialog::backdrop{background:#0008}label{font-size:13px;color:var(--mu)}
.tag{font-size:12px;padding:1px 7px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pr{display:none}.on{color:var(--gn)}.off{color:var(--am)}
@media print{body{background:#fff;color:#000}.noprint,button{display:none!important}.pr{display:block}.card{border:0;padding:0}.tw{overflow:visible}:root{--tx:#000;--mu:#444}}
</style></head><body><div class="w" id="app"></div><dialog id="dlg"></dialog>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===== 1. PASTE YOUR FIREBASE CONFIG HERE (Firebase console > Project settings > Your apps) ===== */
var CFG={apiKey:"AIzaSyClSrOKD2xjE_hQoidGRE4GLrX-VDViB1c",authDomain:"credit-system-3ccbc.firebaseapp.com",projectId:"credit-system-3ccbc",storageBucket:"credit-system-3ccbc.firebasestorage.app",messagingSenderId:"483627612591",appId:"1:483627612591:web:940b9e6341fb61b0dd175a"};
var BIZ="MY BUSINESS NAME"; /* shown on printed statements */
/* ================================================================================================ */
var COL={c:'cc_customers',i:'cc_invoices',p:'cc_payments'},D={c:[],i:[],p:[]},V={page:'home',cid:null,q:''},fs,auth,ready={},started=false;
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function today(){return new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function m(n){return Number(n||0).toLocaleString('en-LK',{minimumFractionDigits:2,maximumFractionDigits:2})}
function dd(a,b){return Math.round((new Date(a)-new Date(b))/864e5)}
function cust(id){return D.c.find(function(x){return x.id===id})}
function g(id){return document.getElementById(id).value.trim()}
function put(k,o){var id=o.id||uid(),x=Object.assign({},o);delete x.id;Object.keys(x).forEach(function(q){if(x[q]===undefined)delete x[q]});fs.collection(COL[k]).doc(id).set(x).catch(function(e){alert('Save failed: '+e.message)});return id}
function rm(k,id){fs.collection(COL[k]).doc(id).delete().catch(function(e){alert('Delete failed: '+e.message)})}
function counted(p){return p.method!=='cheque'||p.st!=='returned'}
function calc(cid){
  var inv=D.i.filter(function(x){return x.cid===cid}).sort(function(a,b){return a.date<b.date?-1:1}),
  pay=D.p.filter(function(x){return x.cid===cid}),rem={},tot=0,paid=0,pool=0,pend=0;
  inv.forEach(function(x){rem[x.id]=x.amt;tot+=x.amt});
  pay.filter(counted).forEach(function(p){paid+=p.amt;if(p.method==='cheque'&&(p.st==='pending'||p.st==='deposited'))pend+=p.amt;
    if(p.inv&&rem[p.inv]!=null){var u=Math.min(rem[p.inv],p.amt);rem[p.inv]-=u;pool+=p.amt-u}else pool+=p.amt});
  inv.forEach(function(x){var u=Math.min(rem[x.id],pool);rem[x.id]-=u;pool-=u});
  return{inv:inv,pay:pay,rem:rem,bal:tot-paid,tot:tot,paid:paid,pend:pend}
}
function alerts(){var t=today(),a=[];
  D.c.forEach(function(c){var r=calc(c.id);
    r.inv.forEach(function(x){if(r.rem[x.id]>0.5&&x.due){var d=dd(x.due,t);if(d<=3)a.push({c:c,lv:d<0?1:2,d:d,t:'Invoice '+x.no+' · Rs '+m(r.rem[x.id]),s:d<0?'<span class="red">overdue '+(-d)+' day(s)</span>':d===0?'due TODAY':'due in '+d+' day(s)'})}});
    r.pay.forEach(function(p){if(p.method!=='cheque')return;
      if(p.st==='returned')a.push({c:c,lv:1,d:-999,t:'Cheque '+p.chq+' · Rs '+m(p.amt),s:'<span class="red">RETURNED – collect again</span>'});
      else if(p.st==='pending'&&p.chqDate){var d=dd(p.chqDate,t);if(d<=3)a.push({c:c,lv:d<0?1:2,d:d,t:'Cheque '+p.chq+' · Rs '+m(p.amt),s:d<0?'<span class="red">cheque date passed – not deposited</span>':d===0?'deposit TODAY':'deposit in '+d+' day(s)'})}})});
  return a.sort(function(a,b){return a.d-b.d})}
function notify(){try{if(!window.Notification||Notification.permission!=='granted')return;var a=alerts(),k='cc_n_'+today();if(!a.length||localStorage.getItem(k))return;localStorage.setItem(k,1);
  new Notification('Credit alerts: '+a.length,{body:a.slice(0,3).map(function(x){return x.c.name+' – '+x.t}).join('\n')})}catch(e){}}
function askNotif(){if(!window.Notification){alert('Notifications not supported on this browser');return}Notification.requestPermission().then(function(){notify();render()})}
function go(p,id){V.page=p;if(id!==undefined)V.cid=id;render();window.scrollTo(0,0)}
function setQ(v){V.q=v;render(true)}
function net(){return '<span class="tag '+(navigator.onLine?'on':'off')+'">'+(navigator.onLine?'● Online':'● Offline – will sync')+'</span>'}
function render(keep){var el=document.getElementById('app');if(!started)return;
  if(!(ready.c&&ready.i&&ready.p)){el.innerHTML='<p class="mu">Loading…</p>';return}
  el.innerHTML=(V.page==='cust'&&cust(V.cid))?custView(cust(V.cid)):(V.page='home',home());
  if(keep){var e=document.getElementById('q');if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length)}}}
function home(){
  var q=V.q.trim().toLowerCase(),all=D.c.map(function(c){return{c:c,r:calc(c.id)}}),
  out=all.reduce(function(s,x){return s+Math.max(0,x.r.bal)},0),al=alerts();
  var list=all.filter(function(x){if(!q)return true;var c=x.c;
    return [c.name,c.shop,c.phone,c.addr,c.loc].join(' ').toLowerCase().indexOf(q)>=0||x.r.inv.some(function(i){return (i.no||'').toLowerCase().indexOf(q)>=0})||x.r.pay.some(function(p){return (p.chq||'').toLowerCase().indexOf(q)>=0})});
  list.sort(function(a,b){return b.r.bal-a.r.bal});
  return '<div class="top"><h1>Credit Manager</h1><div class="row n">'+net()+'<button class="p" onclick="custForm()">+ Customer</button></div></div>'+
  '<div class="grid"><div class="card stat"><span class="mu">Total outstanding</span><b class="red">Rs '+m(out)+'</b></div><div class="card stat"><span class="mu">Customers</span><b>'+D.c.length+'</b></div><div class="card stat"><span class="mu">Alerts</span><b class="'+(al.length?'amb':'')+'">'+al.length+'</b></div></div>'+
  (al.length?'<div class="card"><b>Alerts</b>'+al.slice(0,20).map(function(a){return '<div class="al '+(a.lv===2?'w2':'')+'" onclick="go(\'cust\',\''+a.c.id+'\')"><b>'+esc(a.c.name)+'</b>'+(a.c.shop?' · '+esc(a.c.shop):'')+'<br><span class="mu">'+esc(a.t)+' · '+a.s+'</span></div>'}).join('')+'</div>':'')+
  '<input id="q" placeholder="Search name, shop, phone, address, invoice no, cheque no..." value="'+esc(V.q)+'" oninput="setQ(this.value)">'+
  '<div class="card">'+(list.length?list.map(function(x){return '<div class="li" onclick="go(\'cust\',\''+x.c.id+'\')"><div><b>'+esc(x.c.name)+'</b><div class="mu">'+esc(x.c.shop)+(x.c.phone?' · '+esc(x.c.phone):'')+'</div></div><b class="'+(x.r.bal>0.5?'red':'grn')+'">Rs '+m(x.r.bal)+'</b></div>'}).join(''):'<span class="mu">'+(D.c.length?'No match':'No customers yet. Tap + Customer.')+'</span>')+'</div>'+
  '<div class="row"><button onclick="csv()">Export all balances (Excel/CSV)</button><button onclick="backup()">Backup all data</button>'+(window.Notification&&Notification.permission!=='granted'?'<button onclick="askNotif()">Enable alert notifications</button>':'')+'<button onclick="auth.signOut()">Logout</button></div>'}
function custView(c){
  var r=calc(c.id),t=today(),led=[],bal=0;
  r.inv.forEach(function(x){led.push({d:x.date,k:'i',x:x})});r.pay.forEach(function(p){led.push({d:p.date,k:'p',x:p})});
  led.sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:(a.k==='i'?-1:1)});
  return '<div class="top noprint"><button onclick="go(\'home\')">← Back</button><div class="row n"><button class="s" onclick="window.print()">🖨 Print / PDF statement</button><button class="s" onclick="custForm(\''+c.id+'\')">Edit</button><button class="s d" onclick="delCust(\''+c.id+'\')">Delete</button></div></div>'+
  '<div class="pr"><h1>'+esc(BIZ)+'</h1><b>Customer Account Statement</b> · '+t+'</div>'+
  '<div class="card"><h1>'+esc(c.name)+'</h1><div>'+esc(c.shop)+'</div><div class="mu">'+esc(c.addr)+'</div>'+
  '<div class="mu">'+(c.phone?'📞 <a href="tel:'+esc(c.phone)+'">'+esc(c.phone)+'</a> ':'')+(c.loc?' · 📍 '+(/^https?:/.test(c.loc)?'<a href="'+esc(c.loc)+'" target="_blank" rel="noopener">Map</a>':esc(c.loc)):'')+'</div>'+(c.note?'<div class="mu">'+esc(c.note)+'</div>':'')+
  '<h2 style="margin-bottom:0">Balance: <span class="'+(r.bal>0.5?'red':'grn')+'">Rs '+m(r.bal)+'</span></h2><div class="mu">Total credit Rs '+m(r.tot)+' · Paid Rs '+m(r.paid)+(r.pend>0?' · <span class="amb">Cheques not yet cleared Rs '+m(r.pend)+'</span>':'')+'</div>'+
  '<div class="row noprint" style="margin-top:10px"><button class="p" onclick="invForm(\''+c.id+'\')">+ Credit (Invoice)</button><button class="p" onclick="payForm(\''+c.id+'\')">+ Payment</button></div></div>'+
  '<h2>Invoices</h2>'+(r.inv.length?r.inv.slice().reverse().map(function(x){var rem=r.rem[x.id],d=x.due?dd(x.due,t):null;
    return '<div class="card"><div class="row" style="justify-content:space-between"><div><b>Invoice '+esc(x.no)+'</b> <span class="mu">'+x.date+(x.ref?' · Ref '+esc(x.ref):'')+'</span></div><b>Rs '+m(x.amt)+'</b></div>'+
    (x.items&&x.items.length?'<div class="tw"><table><tr><th>Product</th><th class="n">Qty</th><th class="n">Price</th><th class="n">Total</th></tr>'+x.items.map(function(i){return '<tr><td>'+esc(i.n)+'</td><td class="n">'+i.q+'</td><td class="n">'+m(i.p)+'</td><td class="n">'+m(i.q*i.p)+'</td></tr>'}).join('')+'</table></div>':'')+
    (x.note?'<div class="mu">'+esc(x.note)+'</div>':'')+
    '<div class="row" style="justify-content:space-between;align-items:center;margin-top:6px"><span>'+(rem<=0.5?'<span class="tag grn">PAID</span>':'<span class="tag '+(d!==null&&d<0?'red':'amb')+'">Remaining Rs '+m(rem)+'</span>')+(x.due&&rem>0.5?' <span class="mu">due '+x.due+'</span>':'')+'</span><span class="noprint"><button class="s" onclick="invForm(\''+c.id+'\',\''+x.id+'\')">Edit</button> <button class="s d" onclick="del(\'i\',\''+x.id+'\')">Delete</button></span></div></div>'}).join(''):'<p class="mu">No credit yet.</p>')+
  '<h2>Ledger (running balance)</h2><div class="card tw"><table><tr><th>Date</th><th>Details</th><th class="n">Credit</th><th class="n">Paid</th><th class="n">Balance</th><th class="noprint"></th></tr>'+
  led.map(function(e){var x=e.x,row,ret=e.k==='p'&&!counted(x);
    if(e.k==='i'){bal+=x.amt;row='<td>'+x.date+'</td><td>Invoice '+esc(x.no)+'</td><td class="n">'+m(x.amt)+'</td><td class="n"></td>'}
    else{if(!ret)bal-=x.amt;var iv=x.inv&&D.i.find(function(i){return i.id===x.inv});
      row='<td>'+x.date+'</td><td>'+(x.method==='cheque'?'Cheque '+esc(x.chq)+(x.chqDate?' (dated '+x.chqDate+')':'')+' <span class="tag '+(ret?'red':x.st==='cleared'?'grn':'amb')+'">'+esc(x.st||'pending')+'</span>':'Cash')+(iv?' → Inv '+esc(iv.no):'')+(x.ref?' · '+esc(x.ref):'')+'</td><td class="n"></td><td class="n '+(ret?'red':'grn')+'">'+(ret?'<s>'+m(x.amt)+'</s>':m(x.amt))+'</td>'}
    return '<tr>'+row+'<td class="n">'+m(bal)+'</td><td class="noprint">'+(e.k==='p'?'<button class="s" onclick="payForm(\''+c.id+'\',\''+x.id+'\')">Edit</button> <button class="s d" onclick="del(\'p\',\''+x.id+'\')">✕</button>':'')+'</td></tr>'}).join('')+'</table></div>'+
  '<p class="mu pr">This is a computer-generated statement. Please check with your records.</p>'}
function F(id,l,v,t,ph){return '<label>'+l+'</label><input id="'+id+'" type="'+(t||'text')+'" value="'+esc(v)+'"'+(ph?' placeholder="'+ph+'"':'')+'>'}
function dlgOpen(h){var d=document.getElementById('dlg');d.innerHTML=h;d.showModal()}
function shut(){document.getElementById('dlg').close()}
function custForm(id){var c=id?cust(id):{};
  dlgOpen('<h2 style="margin-top:0">'+(id?'Edit':'New')+' customer</h2>'+F('f1','Customer name *',c.name)+F('f2','Shop name',c.shop)+F('f3','Phone number',c.phone,'tel')+F('f4','Address',c.addr)+F('f5','Location (Google Maps link or place)',c.loc)+F('f6','Note',c.note)+'<div class="row"><button onclick="shut()">Cancel</button><button class="p" onclick="saveCust(\''+(id||'')+'\')">Save</button></div>')}
function saveCust(id){var n=g('f1');if(!n){alert('Name is required');return}
  var o={name:n,shop:g('f2'),phone:g('f3'),addr:g('f4'),loc:g('f5'),note:g('f6')};if(id)o.id=id;
  var nid=put('c',o);if(!id){V.cid=nid;V.page='cust'}shut()}
function invForm(cid,id){var x=id?D.i.find(function(i){return i.id===id}):{date:today(),items:[]};
  var lines=(x.items||[]).map(function(i){return i.n+', '+i.q+', '+i.p}).join('\n');
  dlgOpen('<h2 style="margin-top:0">'+(id?'Edit':'New')+' credit invoice</h2><div class="row">'+F('f1','Invoice no. *',x.no)+F('f2','Date',x.date,'date')+'</div><div class="row">'+F('f3','Payment due date (alert)',x.due,'date')+F('f4','Reference / sales ref',x.ref)+'</div>'+
  '<label>Products (one per line: name, qty, price)</label><textarea id="f5" rows="4" placeholder="CR SINGLE 120P, 10, 250">'+esc(lines)+'</textarea>'+F('f6','Total amount (empty = auto from products)',x.amt||'','number')+F('f7','Note',x.note)+
  '<div class="row"><button onclick="shut()">Cancel</button><button class="p" onclick="saveInv(\''+cid+'\',\''+(id||'')+'\')">Save</button></div>')}
function saveInv(cid,id){var no=g('f1');if(!no){alert('Invoice no. required');return}
  var items=[],sum=0;g('f5').split('\n').forEach(function(l){var p=l.split(',');if(p.length>=3){var q=parseFloat(p[p.length-2]),pr=parseFloat(p[p.length-1]);if(!isNaN(q)&&!isNaN(pr)){items.push({n:p.slice(0,-2).join(',').trim(),q:q,p:pr});sum+=q*pr}}});
  var amt=parseFloat(g('f6'));if(isNaN(amt))amt=sum;if(!(amt>0)){alert('Enter products or a total amount');return}
  var o={cid:cid,no:no,date:g('f2')||today(),due:g('f3'),ref:g('f4'),items:items,amt:amt,note:g('f7')};if(id)o.id=id;put('i',o);shut()}
function payForm(cid,id){var x=id?D.p.find(function(p){return p.id===id}):{date:today(),method:'cash',st:'pending'},r=calc(cid),S=['pending','deposited','cleared','returned'];
  var opts='<option value="">Auto – oldest invoice first</option>'+r.inv.map(function(i){return '<option value="'+i.id+'"'+(x.inv===i.id?' selected':'')+'>Inv '+esc(i.no)+' ('+i.date+') – Rs '+m(i.amt)+'</option>'}).join('');
  dlgOpen('<h2 style="margin-top:0">'+(id?'Edit':'New')+' payment</h2><div class="row">'+F('f1','Amount *',x.amt||'','number')+F('f2','Date received',x.date,'date')+'</div>'+
  '<label>Method</label><select id="f3" onchange="document.getElementById(\'cq\').style.display=this.value===\'cheque\'?\'block\':\'none\'"><option value="cash"'+(x.method==='cash'?' selected':'')+'>Cash</option><option value="cheque"'+(x.method==='cheque'?' selected':'')+'>Cheque</option></select>'+
  '<div id="cq" style="display:'+(x.method==='cheque'?'block':'none')+'"><div class="row">'+F('f4','Cheque no.',x.chq)+F('f5','Cheque date (alert to deposit)',x.chqDate,'date')+'</div><label>Cheque status (Returned = amount added back to balance)</label><select id="f8">'+S.map(function(s){return '<option value="'+s+'"'+((x.st||'pending')===s?' selected':'')+'>'+s+'</option>'}).join('')+'</select></div>'+
  '<label>Pay against invoice</label><select id="f6">'+opts+'</select>'+F('f7','Reference / note',x.ref)+
  '<div class="row"><button onclick="shut()">Cancel</button><button class="p" onclick="savePay(\''+cid+'\',\''+(id||'')+'\')">Save</button></div>')}
function savePay(cid,id){var a=parseFloat(g('f1'));if(!(a>0)){alert('Enter amount');return}
  var o={cid:cid,amt:a,date:g('f2')||today(),method:g('f3'),chq:g('f4'),chqDate:g('f5'),st:g('f8'),inv:g('f6'),ref:g('f7')};
  if(o.method==='cash'){o.chq='';o.chqDate='';o.st=''}if(id)o.id=id;put('p',o);shut()}
function del(k,id){if(confirm('Delete this entry?'))rm(k,id)}
function delCust(id){if(!confirm('Delete this customer and ALL their invoices and payments?'))return;
  var b=fs.batch();b.delete(fs.collection(COL.c).doc(id));D.i.concat(D.p).forEach(function(x){if(x.cid===id)b.delete(fs.collection(x.no!==undefined?COL.i:COL.p).doc(x.id))});b.commit();go('home')}
function dl(name,txt,type){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:type}));a.download=name;a.click()}
function csv(){var r=['Customer,Shop,Phone,Address,Total credit,Paid,Balance'];
  D.c.forEach(function(c){var x=calc(c.id);r.push([c.name,c.shop,c.phone,c.addr,x.tot,x.paid,x.bal].map(function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'}).join(','))});dl('balances-'+today()+'.csv',r.join('\n'),'text/csv')}
function backup(){dl('credit-backup-'+today()+'.json',JSON.stringify(D),'application/json')}
function loginView(){document.getElementById('app').innerHTML='<div class="card" style="max-width:380px;margin:40px auto"><h1>Credit Manager</h1><p class="mu">Login</p><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password" onkeydown="if(event.key===\'Enter\')login()"><button class="p" style="width:100%" onclick="login()">Login</button><p id="err" class="red"></p></div>'}
function login(){auth.signInWithEmailAndPassword(g('em'),document.getElementById('pw').value).catch(function(e){document.getElementById('err').textContent='Login failed: '+e.message})}
function start(){if(started)return;started=true;
  ['c','i','p'].forEach(function(k){fs.collection(COL[k]).onSnapshot(function(s){D[k]=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});ready[k]=true;render();if(ready.c&&ready.i&&ready.p)notify()},function(e){if(!auth.currentUser)return;document.getElementById('app').innerHTML='<p class="red">Cannot read data: '+esc(e.message)+'</p>'})})}
window.addEventListener('online',function(){render()});window.addEventListener('offline',function(){render()});
if(CFG.apiKey==='PASTE'){document.getElementById('app').innerHTML='<div class="card"><h1>Setup needed</h1><p>Open <b>index.html</b> in a text editor and paste your Firebase config at the top (CFG).</p></div>'}
else{firebase.initializeApp(CFG);auth=firebase.auth();fs=firebase.firestore();fs.enablePersistence({synchronizeTabs:true}).catch(function(){});
  auth.onAuthStateChanged(function(u){if(u){start()}else{started=false;ready={};loginView()}})}
</script></body></html>
